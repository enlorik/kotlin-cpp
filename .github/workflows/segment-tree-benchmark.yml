name: Kotlin C++ segment tree comparison

on:
  pull_request:
    paths:
      - 'benchmarks/SegmentTreeKotlin.kt'
      - 'benchmarks/SegmentTreeCpp.cpp'
      - 'benchmarks/generate_segment_tree_workload.py'
      - 'benchmarks/compare_segment_tree.sh'
      - 'tree/SegmentTree.kt'
      - 'tree/LongSumSegmentTree.kt'
      - '.github/workflows/segment-tree-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/SegmentTreeKotlin.kt'
      - 'benchmarks/SegmentTreeCpp.cpp'
      - 'benchmarks/generate_segment_tree_workload.py'
      - 'benchmarks/compare_segment_tree.sh'
      - 'tree/SegmentTree.kt'
      - '.github/workflows/segment-tree-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin 1.9.25
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/kotlin-compiler.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Verify equal results and report non-gating timing
        run: bash benchmarks/compare_segment_tree.sh
