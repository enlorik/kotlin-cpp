name: Kotlin C++ segment tree comparison

on:
  pull_request:
    paths:
      - 'benchmarks/SegmentTreeKotlin.kt'
      - 'benchmarks/SegmentTreeCpp.cpp'
      - 'benchmarks/generate_segment_tree_workload.py'
      - 'benchmarks/compare_segment_tree.sh'
      - 'tree/SegmentTree.kt'
      - 'tree/LongSumSegmentTree.kt'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/segment-tree-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/SegmentTreeKotlin.kt'
      - 'benchmarks/SegmentTreeCpp.cpp'
      - 'benchmarks/generate_segment_tree_workload.py'
      - 'benchmarks/compare_segment_tree.sh'
      - 'tree/SegmentTree.kt'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/segment-tree-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select preinstalled Kotlin (or fallback)
        run: bash scripts/ensure-kotlin.sh
      - name: Verify equal results and report non-gating timing
        run: bash benchmarks/compare_segment_tree.sh
