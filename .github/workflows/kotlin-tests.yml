name: Kotlin library tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select preinstalled Kotlin (or fallback)
        run: bash scripts/ensure-kotlin.sh
      - name: Compile all library modules and run tests
        run: bash scripts/test-kotlin.sh
