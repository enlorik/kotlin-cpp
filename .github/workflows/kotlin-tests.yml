name: Kotlin library tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler 1.9.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -o /tmp/kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip
          unzip -q /tmp/kotlin-compiler.zip -d /tmp
          echo "/tmp/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile all library modules and run tests
        run: bash scripts/test-kotlin.sh
