name: Kotlin automatic range-index regression

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - 'benchmarks/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/range-index.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - 'benchmarks/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/range-index.yml'

permissions:
  contents: read

jobs:
  range-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select preinstalled Kotlin (or fallback)
        run: bash scripts/ensure-kotlin.sh
      - name: Validate custom-operation range selection against real modules
        run: bash tools/test_range_index.sh
      - name: Run reproducible non-gating performance observations
        run: bash tools/benchmark_range_index.sh
