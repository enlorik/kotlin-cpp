name: Kotlin custom algebra regression

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/custom-algebra.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/custom-algebra.yml'

permissions:
  contents: read

jobs:
  range-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select preinstalled Kotlin (or fallback)
        run: bash scripts/ensure-kotlin.sh
      - name: Test custom algebra with real source modules
        run: bash tools/test_custom_algebra.sh
      - name: Test earlier operation-driven APIs
        run: bash tools/test_operation_apis.sh
