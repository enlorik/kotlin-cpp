name: Kotlin custom algebra regression

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/custom-algebra.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/custom-algebra.yml'

permissions:
  contents: read

jobs:
  range-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin 1.9.25
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/kotlin-compiler.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Test custom algebra with real source modules
        run: bash tools/test_custom_algebra.sh
      - name: Test earlier operation-driven APIs
        run: bash tools/test_operation_apis.sh
