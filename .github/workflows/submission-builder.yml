name: Kotlin standalone submission builder

on:
  pull_request:
    paths:
      - 'tools/build_submission.py'
      - 'tools/test_submission_builder.sh'
      - 'tools/fixtures/**'
      - 'tests/test_submission_builder.py'
      - 'graph/**'
      - 'grid/**'
      - 'io/**'
      - 'range/**'
      - 'search/**'
      - 'shared/**'
      - 'tree/**'
      - '.github/workflows/submission-builder.yml'
  push:
    branches: [main]
    paths:
      - 'tools/build_submission.py'
      - 'tools/test_submission_builder.sh'
      - 'tools/fixtures/**'
      - 'tests/test_submission_builder.py'
      - 'graph/**'
      - 'grid/**'
      - 'io/**'
      - 'range/**'
      - 'search/**'
      - 'shared/**'
      - 'tree/**'
      - '.github/workflows/submission-builder.yml'

permissions:
  contents: read

jobs:
  generate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin 1.9.25
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/kotlin-compiler.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Generate, compile, and execute standalone submissions
        run: bash tools/test_submission_builder.sh
