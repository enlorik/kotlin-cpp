name: Kotlin standalone submission builder

on:
  pull_request:
    paths:
      - 'tools/build_submission.py'
      - 'tools/test_submission_builder.sh'
      - 'tools/fixtures/**'
      - 'tests/test_submission_builder.py'
      - 'graph/**'
      - 'grid/**'
      - 'io/**'
      - 'range/**'
      - 'search/**'
      - 'shared/**'
      - 'tree/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/submission-builder.yml'
  push:
    branches: [main]
    paths:
      - 'tools/build_submission.py'
      - 'tools/test_submission_builder.sh'
      - 'tools/fixtures/**'
      - 'tests/test_submission_builder.py'
      - 'graph/**'
      - 'grid/**'
      - 'io/**'
      - 'range/**'
      - 'search/**'
      - 'shared/**'
      - 'tree/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/submission-builder.yml'

permissions:
  contents: read

jobs:
  generate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select preinstalled Kotlin (or fallback)
        run: bash scripts/ensure-kotlin.sh
      - name: Generate, compile, and execute standalone submissions
        run: bash tools/test_submission_builder.sh
