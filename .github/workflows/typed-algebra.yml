name: Kotlin typed algebra contracts

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/typed-algebra.yml'
  push:
    branches: [main]
    paths:
      - 'shared/**'
      - 'range/**'
      - 'tree/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/ensure-kotlin.sh'
      - '.github/workflows/typed-algebra.yml'

permissions:
  contents: read

jobs:
  algebra-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Select preinstalled Kotlin (or fallback)
        run: bash scripts/ensure-kotlin.sh
      - name: Check algebra laws and compiler rejections
        run: bash tools/test_typed_algebra.sh
